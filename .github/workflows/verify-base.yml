name: Verify Base Image Upgrade

# 临时验证工作流：构建双架构镜像并做运行时冒烟测试。
# 不向 ghcr 推送任何镜像，不影响生产（latest 标签不受影响）。
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no registry push)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: link-nvidia-verify:latest
          cache-from: type=gha

      - name: Confirm Alpine release
        run: |
          rel=$(docker run --rm --platform ${{ matrix.platform }} --entrypoint cat link-nvidia-verify:latest /etc/alpine-release)
          echo "Alpine release: ${rel}"
          case "${rel}" in
            3.24.*) echo "Alpine 3.24 confirmed" ;;
            *) echo "Unexpected Alpine release: ${rel}"; exit 1 ;;
          esac

      - name: Assert component versions
        run: |
          echo "--- sing-box ---"
          sb_ver=$(docker run --rm --platform ${{ matrix.platform }} --entrypoint /usr/local/bin/php-fpm link-nvidia-verify:latest version)
          echo "${sb_ver}"
          echo "${sb_ver}" | grep -q 'sing-box version 1.13.21' || { echo "unexpected sing-box version"; exit 1; }
          echo "--- cloudflared ---"
          cf_ver=$(docker run --rm --platform ${{ matrix.platform }} --entrypoint /usr/sbin/rsyslogd2 link-nvidia-verify:latest --version)
          echo "${cf_ver}"
          echo "${cf_ver}" | grep -q '2026.9.1' || { echo "unexpected cloudflared version"; exit 1; }

      - name: Run container (cloudflared stubbed out)
        run: |
          printf '#!/bin/sh\nexec sleep infinity\n' > fake-cloudflared.sh
          chmod +x fake-cloudflared.sh
          docker run -d --name verify \
            --platform ${{ matrix.platform }} \
            -v "$PWD/fake-cloudflared.sh:/usr/sbin/rsyslogd2:ro" \
            -p 18081:8081 \
            link-nvidia-verify:latest

      - name: Probe subscription health endpoint
        run: |
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:18081/health >/dev/null 2>&1; then
              echo "health OK (attempt ${i})"
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "health endpoint never became ready"
            docker logs verify 2>&1 | tail -50
            exit 1
          fi
          curl -fsS http://localhost:18081/health
          echo

      - name: Verify subscription payload
        run: |
          body=$(curl -fsS http://localhost:18081/sub/clash)
          echo "$body" | head -n 8
          echo "$body" | grep -qi 'reality' || { echo "reality node missing from subscription"; exit 1; }

      - name: Verify sing-box listeners and supervisor
        run: |
          docker ps --filter "name=verify"
          echo "--- TCP listeners ---"
          docker exec verify netstat -tln
          echo "--- UDP listeners ---"
          docker exec verify netstat -uln
          docker exec verify netstat -tln | grep -E ':(443|8080|8081|9444) ' || { echo "expected TCP listeners missing"; exit 1; }
          docker logs verify 2>&1 | grep -q 'all components ready' || { echo "entrypoint did not report ready"; docker logs verify; exit 1; }
          if docker logs verify 2>&1 | grep -q 'critical process exited'; then
            echo "supervisor reported a dead process"
            docker logs verify
            exit 1
          fi
          [ "$(docker inspect -f '{{.State.Running}}' verify)" = "true" ] || { echo "container exited unexpectedly"; docker logs verify; exit 1; }

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          docker logs verify 2>&1 | tail -100 || true
          docker exec verify sh -c 'tail -n 50 /tmp/ln-core.log /tmp/ln-edge.log /tmp/ln-web.log' 2>/dev/null || true
