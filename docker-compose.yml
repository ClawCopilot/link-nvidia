services:
  link-nvidia:
    image: ghcr.io/clawcopilot/link-nvidia:latest
    container_name: link-nvidia
    restart: unless-stopped
    ports:
      # L4 proxy protocols: publish directly on the host.
      # Do NOT configure these as Cloudflare Tunnel HTTP origins.
      - "443:443/tcp"     # VLESS Reality Vision
      - "8443:8443/udp"   # Hysteria2 / QUIC
      - "9443:9443/udp"   # TUIC v5 / QUIC
      - "9444:9444/tcp"   # AnyTLS

      # HTTP-compatible services. cloudflared runs in this same container and
      # reaches them through localhost.
      - "127.0.0.1:8080:8080/tcp" # VMess WebSocket origin
      - "127.0.0.1:8081:8081/tcp" # subscription/health origin

    environment:
      # Intentionally embedded defaults; deployment environments may override them.
      UUID: ${UUID:-1b4db7eb-4057-5ddf-91e0-36dec72071f5}
      ARGO_TOKEN: ${ARGO_TOKEN:-eyJhIjoiZDBkM2UzZjUyZWI1MDQzYjRlYjU3ZTEzZTkwNzg0OTEiLCJ0IjoiNjU1YWUyYWItZjA3Yi00YzM2LTgwOGQtMzk3OTJjMTAyYjgwIiwicyI6Ik5EZ3pZek5oT1dVdE1HVXhPUzAwTkRCa0xUbGlaRFV0T0dWbU9XRXpNMkk1WkRKaCJ9}

      # Public hostname served by Cloudflare Tunnel for VMess WS.
      ARGO_DOMAIN: ${ARGO_DOMAIN:-link-nvidia.techidaily.com}

      # Public DNS name/IP that resolves directly to this Docker host.
      # Reality/HY2/TUIC/AnyTLS subscriptions use this address, not ARGO_DOMAIN.
      DIRECT_DOMAIN: ${DIRECT_DOMAIN:-direct.link-nvidia.techidaily.com}

      REALITY_SNI: ${REALITY_SNI:-www.microsoft.com}
      REALITY_PRIVATE_KEY: ${REALITY_PRIVATE_KEY:-iEN-abAE80W942AqjpS0k6a6UenauvBca45P1QTFLnw}
      REALITY_PUBLIC_KEY: ${REALITY_PUBLIC_KEY:-wv6JL9uQquOEgd4Y5UOwYRspCsKkaxk3K8ePX1Xno2w}
      REALITY_SHORT_ID: ${REALITY_SHORT_ID:-3ff4bf41}

      WARP_ENABLED: ${WARP_ENABLED:-false}
      KEEPALIVE_INTERVAL: ${KEEPALIVE_INTERVAL:-10m}

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    shm_size: "256mb"

networks:
  default:
    driver: bridge
